name: Publish @avodotso/market-sdk

# Publish unpublished package versions on main, matching version tags, or manual runs.
# npmjs.com must trust avodotso/market-sdk's publish.yml before the first OIDC run.
on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

# Serialize main/tag/manual releases so two runs cannot publish the same version.
concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  check:
    name: Check exact npm version
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      version: ${{ steps.local.outputs.version }}
      should_publish: ${{ steps.npm.outputs.should_publish }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Read local package.json version
        id: local
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "package.json version is $version"

      - name: Check whether the exact version is already published
        id: npm
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          const { name, version } = JSON.parse(readFileSync('package.json', 'utf8'));
          const url = `https://registry.npmjs.org/${encodeURIComponent(name)}/${encodeURIComponent(version)}`;
          const response = await fetch(url, { signal: AbortSignal.timeout(30_000) });
          let shouldPublish;
          if (response.ok) {
            const published = await response.json();
            if (published.version !== version) throw new Error('Unexpected npm version response');
            shouldPublish = false;
            console.log(`::notice::${name}@${version} already exists on npm; skipping publish.`);
          } else if (response.status === 404) {
            shouldPublish = true;
            console.log(`${name}@${version} is not published yet.`);
          } else {
            // Authentication, rate-limit and registry failures are not proof of absence.
            throw new Error(`npm version check failed: HTTP ${response.status}`);
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `should_publish=${shouldPublish}\n`);
          NODE

  publish:
    name: Publish to npm
    needs: check
    if: needs.check.outputs.should_publish == 'true'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          scope: '@avodotso'

      - name: Install npm with trusted publishing support
        run: |
          npm install --global npm@11.5.1
          node --version
          npm --version

      # Tag-version invariant: when a `v*` tag triggered this run, the
      # tag's version segment must equal package.json's version. Catches
      # "forgot to bump package.json before tagging" — npm versions are
      # immutable, so the cost of publishing the wrong version is high.
      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag_version="${GITHUB_REF#refs/tags/v}"
          pkg_version="${{ needs.check.outputs.version }}"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::tag is v$tag_version but package.json has version $pkg_version"
            exit 1
          fi
          echo "tag and package.json both say $pkg_version"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # `prepublishOnly` already runs clean + build + test — invoke them
      # explicitly here so a failure shows up as its own step in the
      # workflow log instead of getting tangled in npm publish output.
      - name: Build
        run: yarn build

      - name: Test
        run: yarn test

      - name: Publish with GitHub OIDC
        run: npm publish --access public

      - name: Summary
        run: |
          version="${{ needs.check.outputs.version }}"
          echo "## Published @avodotso/market-sdk@$version" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Available at: https://www.npmjs.com/package/@avodotso/market-sdk/v/$version" >> "$GITHUB_STEP_SUMMARY"
